
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_vms
      POSTGRES_USER: vms_user
      POSTGRES_PASSWORD: ${VMS_DB_PASSWORD:?Set VMS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U vms_user -d recruitment_vms
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
